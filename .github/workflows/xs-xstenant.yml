name: xstenant
# The upstream CI workflows are disabled in this fork, and the nested
# xstenant module is outside the root module's ./... anyway.
on:
  push:
    branches:
      - main
    paths:
      - "xstenant/**"
      - ".github/workflows/xs-xstenant.yml"
  pull_request:
    paths:
      - "xstenant/**"
      - ".github/workflows/xs-xstenant.yml"

permissions:
  contents: read

concurrency:
  group: "xstenant-${{ github.ref_name }}-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xstenant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: xstenant/go.mod
          cache-dependency-path: xstenant/go.sum
      - name: Module is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
